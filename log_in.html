<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - MB Bank</title>
    <link rel="stylesheet" href="log_in.css">
</head>
<body>
    <form id="loginForm" class="log_in_container">
        <div class="bank-icon">
            <img src="assets/BankIcon.png" alt="BankIcon">
        </div>
        <span class="welcome-title">Welcome Back</span>

        <div class="email">
            <span>Email:</span>
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <polyline points="2,6 12,13 22,6"></polyline>
                </svg>

                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
        </div>

        <div class="password">
            <span>Password:</span>
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>

                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
        </div>

        <span class="forgot-password">Forgot password?</span>


        <button class="log-in-btn" type="submit">Log In</button>

        <span class="sign-up">Don't have an account? <a href="sign_up.html">Sign Up</a></span>
    </form>

    <script src="js/log_in.js"></script>
</body>
</html>
