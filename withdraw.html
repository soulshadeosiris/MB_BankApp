<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - MB Bank</title>
    <link rel="stylesheet" href="withdraw.css">
</head>
<body>
    <form id="depositForm" class="deposit-container">
        <span class="deposit-title">Withdraw Money</span>
        <div class="deposit-logo">
            <img src="assets/DepositLogo.png" alt="Deposit Logo">
        </div>

        <div class="amount">
            <span>Enter amount:</span>
            <div class="input-wrapper">
                <svg class="input-icon" width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-size="48" font-family="Arial, Helvetica, sans-serif" fill="currentColor">$</text>
                </svg>

                <input type="text" name="amount" placeholder="0.00" required>
            </div>
        </div>

        <span class="select-account">Select Account:</span>

        <div class="select">    
            <div class="select-header">
                <span class="select-value">Choose Account</span>
                <span class="arrow">▼</span>
            </div>

            <div class="select-dropdown">
                
            </div>
        </div>

        <button class="withdraw-btn">Withdraw</button>
        
        <span class="go-to-dashboard"><a href="index.html">&larr; Go to Dashboard</a></span>
    </form>

    <script src="js/withdraw.js"></script>
</body>
</html>
